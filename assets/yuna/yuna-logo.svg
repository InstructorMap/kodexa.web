<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 116" role="img" aria-labelledby="title desc">
<title id="title">YUNA — 優奈</title>
<desc id="desc">Versión simplificada del logotipo original de YUNA: sakura y arco dorado junto al nombre YUNA y sus kanji.</desc>
<defs>
 <linearGradient id="gold" x1="12" y1="8" x2="112" y2="108" gradientUnits="userSpaceOnUse">
  <stop stop-color="#FFF0C9"/><stop offset=".48" stop-color="#D7A56D"/><stop offset="1" stop-color="#A96D4E"/>
 </linearGradient>
 <linearGradient id="pink" x1="25" y1="15" x2="91" y2="91" gradientUnits="userSpaceOnUse">
  <stop stop-color="#FFE1E8"/><stop offset=".55" stop-color="#E995AD"/><stop offset="1" stop-color="#B94E70"/>
 </linearGradient>
 <linearGradient id="ivory" x1="143" y1="20" x2="465" y2="90" gradientUnits="userSpaceOnUse">
  <stop stop-color="#FFF8F0"/><stop offset="1" stop-color="#DCCBC5"/>
 </linearGradient>
</defs>
<!-- Simplified ensō and sakura branch, based on the original banner emblem -->
<path d="M91 23A48 48 0 1 0 103 68" fill="none" stroke="url(#gold)" stroke-width="3.4" stroke-linecap="round"/>
<path d="M17 61C26 38 38 24 55 15" fill="none" stroke="url(#gold)" stroke-width="2.2" stroke-linecap="round"/>
<path d="M29 43C41 34 49 25 56 14M42 31L34 19M51 23L66 20M24 53L12 47" fill="none" stroke="#D7A56D" stroke-width="1.6" stroke-linecap="round"/>
<!-- Five-petal cherry blossom -->
<g transform="translate(58 48)">
 <g fill="url(#pink)" stroke="#F8D6DC" stroke-width=".8">
  <ellipse cx="0" cy="-16" rx="8.2" ry="13" transform="rotate(-7)"/>
  <ellipse cx="15" cy="-5" rx="8.2" ry="13" transform="rotate(65 15 -5)"/>
  <ellipse cx="9" cy="13" rx="8.2" ry="13" transform="rotate(143 9 13)"/>
  <ellipse cx="-10" cy="12" rx="8.2" ry="13" transform="rotate(215 -10 12)"/>
  <ellipse cx="-15" cy="-5" rx="8.2" ry="13" transform="rotate(290 -15 -5)"/>
 </g>
 <circle r="4.1" fill="#F6D9A9"/>
 <g stroke="#F6D9A9" stroke-width="1.1" stroke-linecap="round">
  <path d="M0-3L0-10M3-1L9-5M3 2L9 5M-3 2L-9 7M-3-1L-9-5"/>
 </g>
</g>
<!-- Wordmark kept clean and legible at small header sizes -->
<text x="143" y="73" fill="url(#ivory)" font-family="'Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="65" font-weight="500" letter-spacing="12">YUNA</text>
<text x="458" y="69" fill="#E8D5D0" font-family="'Noto Serif JP','Yu Mincho',serif" font-size="30" text-anchor="start">優奈</text>
<path d="M147 88H510" stroke="url(#gold)" stroke-width="1.1" opacity=".75"/>
</svg>