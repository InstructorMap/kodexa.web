
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 400 400"
     width="400"
     height="400"
     role="img"
     aria-label="Robot asistente KODEXA">

  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172B50"/>
      <stop offset="1" stop-color="#020B24"/>
    </linearGradient>

    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00C8FF"/>
      <stop offset="1" stop-color="#006BFF"/>
    </linearGradient>

    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#263E65"/>
      <stop offset="1" stop-color="#0A1732"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD66B"/>
      <stop offset="1" stop-color="#FFB800"/>
    </linearGradient>

    <filter id="blueGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- Sombra -->
  <ellipse cx="200" cy="358" rx="75" ry="10"
           fill="#000000" opacity=".28" filter="url(#shadow)"/>

  <!-- Antena -->
  <path d="M200 79 V58"
        stroke="#006BFF" stroke-width="5" stroke-linecap="round"/>
  <circle cx="200" cy="51" r="8" fill="#FFB800"/>
  <circle cx="200" cy="51" r="13" fill="#FFB800" opacity=".15"/>

  <!-- Cabeza -->
  <rect x="126" y="82" width="148" height="126"
        rx="35" fill="url(#shell)"
        stroke="#28518A" stroke-width="2.5"/>

  <!-- Borde superior -->
  <path d="M157 91 Q200 78 243 91"
        fill="none" stroke="#00C8FF"
        stroke-width="2" opacity=".65"/>

  <!-- Laterales de cabeza -->
  <path d="M126 130 H116 Q108 130 108 140 V163 Q108 173 118 173 H126"
        fill="url(#metal)" stroke="#28518A" stroke-width="2"/>
  <path d="M274 130 H284 Q292 130 292 140 V163 Q292 173 282 173 H274"
        fill="url(#metal)" stroke="#28518A" stroke-width="2"/>

  <!-- Visor -->
  <rect x="143" y="119" width="114" height="65"
        rx="25" fill="#01091D"
        stroke="#006BFF" stroke-width="2"/>

  <rect x="149" y="125" width="102" height="53"
        rx="21" fill="url(#visor)" opacity=".18"/>

  <!-- Brillo visor -->
  <path d="M162 131 Q200 119 238 131"
        fill="none" stroke="#00C8FF"
        stroke-width="2" opacity=".65"/>

  <!-- Ojos -->
  <ellipse cx="174" cy="151" rx="7" ry="10" fill="#00C8FF"/>
  <ellipse cx="226" cy="151" rx="7" ry="10" fill="#00C8FF"/>

  <circle cx="172" cy="147" r="2.5" fill="#FFFFFF"/>
  <circle cx="224" cy="147" r="2.5" fill="#FFFFFF"/>

  <!-- Sonrisa -->
  <path d="M187 166 Q200 175 213 166"
        fill="none" stroke="#FFFFFF"
        stroke-width="2.5" stroke-linecap="round" opacity=".85"/>

  <!-- Cuello -->
  <path d="M180 207 V220 H220 V207"
        fill="url(#metal)" stroke="#28518A" stroke-width="2"/>

  <!-- Torso -->
  <path d="M145 222
           Q145 211 160 211
           H240
           Q255 211 255 222
           L269 321
           Q200 346 131 321
           Z"
        fill="url(#shell)"
        stroke="#28518A" stroke-width="2.5"/>

  <!-- Hombros -->
  <circle cx="139" cy="235" r="15"
          fill="#142B50" stroke="#006BFF" stroke-width="2"/>
  <circle cx="261" cy="235" r="15"
          fill="#142B50" stroke="#006BFF" stroke-width="2"/>

  <!-- Panel central -->
  <rect x="157" y="239" width="86" height="67"
        rx="17" fill="#01091D"
        stroke="#006BFF" stroke-width="2"/>

  <!-- K geométrica -->
  <path d="M178 253 V291
           M178 272 L211 253
           M178 272 L211 291"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="7"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Acento dorado de la K -->
  <circle cx="218" cy="272" r="4" fill="url(#gold)"/>

  <!-- Indicadores -->
  <circle cx="166" cy="224" r="3" fill="#FFB800"/>
  <circle cx="178" cy="224" r="3" fill="#00C8FF"/>
  <circle cx="222" cy="224" r="3" fill="#00C8FF"/>
  <circle cx="234" cy="224" r="3" fill="#FFB800"/>

  <!-- Brazos -->
  <path d="M128 246 Q111 253 109 276 L106 301
           Q105 313 116 315 Q128 317 132 305
           L139 269"
        fill="url(#metal)" stroke="#28518A" stroke-width="2.5"/>

  <path d="M272 246 Q289 253 291 276 L294 301
           Q295 313 284 315 Q272 317 268 305
           L261 269"
        fill="url(#metal)" stroke="#28518A" stroke-width="2.5"/>

  <!-- Manos -->
  <circle cx="117" cy="316" r="12"
          fill="#142B50" stroke="#00C8FF" stroke-width="2"/>
  <circle cx="283" cy="316" r="12"
          fill="#142B50" stroke="#00C8FF" stroke-width="2"/>

  <circle cx="117" cy="316" r="4" fill="#00C8FF"/>
  <circle cx="283" cy="316" r="4" fill="#00C8FF"/>

  <!-- Base inferior -->
  <path d="M158 328 Q200 342 242 328"
        fill="none" stroke="#006BFF"
        stroke-width="3" stroke-linecap="round"/>

  <!-- Detalle dorado -->
  <path d="M248 217 L259 217 L253 228 Z"
        fill="url(#gold)"/>

</svg>
