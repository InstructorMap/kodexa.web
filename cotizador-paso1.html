<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KODEXA - Cotizador Móvil Paso 1</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-[#f8f9ff] text-slate-800 pb-28">
  <header class="bg-white border-b border-slate-200 px-5 py-4 flex items-center justify-between sticky top-0 z-40">
    <div class="flex items-center gap-2">
      <a href="index.html" class="w-8 h-8 rounded-lg bg-blue-600 text-white font-black flex items-center justify-center text-sm">K</a>
      <span class="font-extrabold text-slate-900 tracking-tight text-base">KODEXA</span>
    </div>
    <span class="text-xs font-bold text-blue-600 bg-blue-50 px-2.5 py-1 rounded-full">Paso 1 de 3</span>
  </header>

  <main class="p-5 space-y-4">
    <h1 class="text-xl font-extrabold text-slate-900">Seleccioná la Base de tu Proyecto</h1>
    <p class="text-xs text-slate-500">Elegí la arquitectura de desarrollo inicial.</p>
    <div id="bases" class="space-y-3 pt-2"></div>
  </main>

  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 p-4 flex items-center justify-between shadow-lg z-50">
    <div>
      <span class="text-[10px] text-slate-400 block font-bold uppercase">Subtotal Base</span>
      <span id="subtotal" class="font-extrabold text-blue-600 text-lg">$0 ARS</span>
    </div>
    <a href="cotizador-paso2.html" class="bg-blue-600 text-white font-bold text-xs px-6 py-3 rounded-xl shadow-md">Continuar al Paso 2 →</a>
  </nav>

  <script src="app.js"></script>
  <script>
    const bases = [
      { id: 'ecommerce', title: 'Tienda Digital E-commerce', desc: 'Carro, inventario, Mercado Pago integrado.' },
      { id: 'landing',   title: 'Landing Page Pro',           desc: 'Alta velocidad de conversión y captación.' },
      { id: 'gestion',   title: 'Sistema de Gestión Web',     desc: 'Intranet y paneles B2B operacionales.' }
    ];

    function render() {
      const state = KODEXA.getState();
      const container = document.getElementById('bases');
      container.innerHTML = bases.map(b => {
        const active = state.base === b.id;
        const price = KODEXA.CATALOG.bases[b.id].price;
        return `
          <div data-base="${b.id}" class="cursor-pointer rounded-xl p-4 shadow-sm transition ${active
            ? 'bg-white border-2 border-blue-600 relative'
            : 'bg-white border border-slate-200 hover:border-slate-300'}">
            ${active ? '<span class="absolute top-3 right-3 text-[10px] bg-blue-600 text-white font-extrabold px-2 py-0.5 rounded">ELEGIDO</span>' : ''}
            <h3 class="font-bold text-sm text-slate-900">${b.title}</h3>
            <p class="text-xs text-slate-500 mt-1">${b.desc}</p>
            <div class="mt-3 font-extrabold ${active ? 'text-blue-600' : 'text-slate-700'} text-sm">${KODEXA.formatARS(price)} ARS</div>
          </div>`;
      }).join('');
      document.getElementById('subtotal').textContent = KODEXA.formatARS(KODEXA.CATALOG.bases[state.base].price) + ' ARS';
      container.querySelectorAll('[data-base]').forEach(el => {
        el.addEventListener('click', () => {
          KODEXA.setBase(el.dataset.base);
          render();
        });
      });
    }

    document.addEventListener('DOMContentLoaded', render);
    document.addEventListener('kodexa:state', render);
  </script>
</body>
</html>
