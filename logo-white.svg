<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 112" role="img" aria-labelledby="title desc">
  <title id="title">KODEXA Digital Solutions</title>
  <desc id="desc">Símbolo geométrico azul con una K calada y acento dorado, acompañado por el nombre KODEXA.</desc>
  <defs>
    <linearGradient id="kodexa-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1680FF"/>
      <stop offset="1" stop-color="#0056D6"/>
    </linearGradient>
    <mask id="kodexa-k-cutout" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" x="0" y="0" width="88" height="88">
      <rect x="0" y="0" width="88" height="88" fill="white"/>
      <path d="M29 18 V70 M29 44 L58 18 M29 44 L61 70"
            fill="none" stroke="black" stroke-width="10"
